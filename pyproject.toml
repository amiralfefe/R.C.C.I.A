[project]
name = "rccia"
version = "0.1.0"
description = "Multi-project educational AI portfolio for cancer image classification experiments."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = [
    "projects/leukemia/tests",
    "projects/lung_colon/tests",
    "projects/breast/tests",
    "projects/metastasis/tests",
    "projects/multicancer/tests",
]
pythonpath = [
    "projects/leukemia",
    "projects/lung_colon",
    "projects/breast",
    "projects/metastasis",
    "projects/multicancer",
]
